services:
  app:
    build: .
    container_name: spring-app

    ports:
      - "${APP_PORT}:8080"

    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:?Missing Kafka address}
      KAFKA_USERNAME: ${KAFKA_USERNAME:?Missing Kafka username}
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:?Missing Kafka password}

      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:?Missing Kafka group}
      STUDENT_ID: ${STUDENT_ID:?Missing student ID}
      STRATEGY_ID: ${STRATEGY_ID:?Missing strategy ID}
      SERVICE_NAME: ${SERVICE_NAME:?Missing service name}
      CANDLE_TOPIC: ${CANDLE_TOPIC:?Missing candle topic}