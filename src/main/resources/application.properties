spring.application.name=stock-market

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:omsu.7bits.it:9094}

spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.properties.sasl.mechanism=SCRAM-SHA-256
spring.kafka.properties.ssl.endpoint.identification.algorithm=https

spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";

spring.kafka.consumer.group-id=${KAFKA_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

app.student-id=${STUDENT_ID}
app.strategy-id=${STRATEGY_ID}
app.service-name=${SERVICE_NAME}
app.candle-topic=${CANDLE_TOPIC}
app.version=1.0.1

# Registration
app.registration.request-topic=account.registration.request
app.registration.result-topic=account.registration.result
app.heartbeat.topic=account.service.heartbeat

app.registration.secret-key=${KAFKA_USERNAME}
app.registration.account-id=${STUDENT_ID}
app.registration.account-name=${APP_PLATFORM_ACCOUNT_NAME}
app.registration.group-id=${APP_PLATFORM_STUDY_GROUP_ID}
app.registration.strategy-id=${STRATEGY_ID}
app.registration.strategy-name=${APP_PLATFORM_STRATEGY_NAME}
app.registration.service-name=${SERVICE_NAME}
app.registration.description=Mean reversion trading strategy